AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Reactome status page: private S3 bucket served through CloudFront at a custom
  domain, plus an IAM policy that lets production hosts upload their snapshots.

Parameters:
  DomainName:
    Type: String
    Default: status.reactome.org
    Description: Public hostname of the status page (also used as the bucket name).
  CertificateArn:
    Type: String
    Description: >
      ARN of an ISSUED ACM certificate for DomainName in us-east-1
      (create it first with `infra/deploy.sh cert`).
  CollectorRoleName:
    Type: String
    Default: EC2CloudwatchAgentRole
    Description: Existing IAM role used by production EC2 instances; gets upload rights. Leave empty to skip.
  RawRetentionDays:
    Type: Number
    Default: 90
    Description: Days to keep the per-run raw snapshots under raw/.

Conditions:
  AttachToRole: !Not [!Equals [!Ref CollectorRoleName, ""]]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref DomainName
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-snapshots
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: !Ref RawRetentionDays
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 2 }
      Tags:
        - { Key: Project, Value: reactome-status }

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${DomainName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Reactome status page (${DomainName})"
        Aliases: [!Ref DomainName]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: s3
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed "CachingOptimized": honours the Cache-Control set on each object by the collector/deploy script.
          CachePolicyId: 658327ea-f89d-4fbd-85d3-8f6ba4d5e1e5
          # Managed "SecurityHeadersPolicy"
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CustomErrorResponses:
          # S3 answers 403 for missing keys behind OAC; expose them as 404 and do not cache misses for long
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.json, ErrorCachingMinTTL: 10 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.json, ErrorCachingMinTTL: 10 }
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - { Key: Project, Value: reactome-status }

  CollectorUploadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${DomainName}-collector-upload"
      Description: Lets production hosts upload status snapshots (data/ and raw/ only).
      Roles: !If [AttachToRole, [!Ref CollectorRoleName], !Ref "AWS::NoValue"]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: UploadSnapshots
            Effect: Allow
            Action: [s3:PutObject]
            Resource:
              - !Sub "${Bucket.Arn}/data/*"
              - !Sub "${Bucket.Arn}/raw/*"

Outputs:
  BucketName:
    Value: !Ref Bucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Create a DNS-only CNAME for DomainName pointing here.
    Value: !GetAtt Distribution.DomainName
  CollectorUploadPolicyArn:
    Value: !Ref CollectorUploadPolicy
