AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Reactome status page: private S3 bucket served through CloudFront at a custom
  domain, plus an IAM policy that lets production hosts upload their snapshots.

Parameters:
  DomainName:
    Type: String
    Default: status.reactome.org
    Description: Public hostname of the status page (also used as the bucket name).
  CertificateArn:
    Type: String
    Description: >
      ARN of an ISSUED ACM certificate for DomainName in us-east-1
      (create it first with `infra/deploy.sh cert`).
  CollectorRoleName:
    Type: String
    Default: EC2CloudwatchAgentRole
    Description: Existing IAM role used by production EC2 instances; gets upload rights. Leave empty to skip.
  RawRetentionDays:
    Type: Number
    Default: 90
    Description: Days to keep the per-run raw snapshots under raw/.

Conditions:
  AttachToRole: !Not [!Equals [!Ref CollectorRoleName, ""]]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref DomainName
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      # versioning lets an accidental `sync --delete` or a bad upload from a host be rolled back
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-snapshots
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: !Ref RawRetentionDays
          - Id: expire-old-versions
            Status: Enabled
            Prefix: ""
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            ExpiredObjectDeleteMarker: true
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 2 }
      Tags:
        - { Key: Project, Value: reactome-status }

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${DomainName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Reactome status page (${DomainName})"
        Aliases: [!Ref DomainName]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          # the page itself: keys under site/, which the hosts' upload policy cannot write
          - Id: site
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginPath: /site
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          # host-uploaded snapshots: keys under data/ and raw/
          - Id: uploads
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref CachePolicy
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        CacheBehaviors:
          # Objects under data/ and raw/ are written by the production hosts, not by this repo.
          # Whatever a host uploads is served as inert JSON: content-type is forced by a viewer-
          # response function and a sandboxing CSP means even an HTML upload cannot run or phish.
          - PathPattern: "data/*"
            TargetOriginId: uploads
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref DataCachePolicy
            ResponseHeadersPolicyId: !Ref DataHeaders
            FunctionAssociations:
              - EventType: viewer-response
                FunctionARN: !GetAtt ForceJsonFunction.FunctionMetadata.FunctionARN
          - PathPattern: "raw/*"
            TargetOriginId: uploads
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref CachePolicy
            ResponseHeadersPolicyId: !Ref DataHeaders
            FunctionAssociations:
              - EventType: viewer-response
                FunctionARN: !GetAtt ForceJsonFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          # S3 answers 403 for missing keys behind OAC; expose them as 404 and do not cache misses for long
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.json, ErrorCachingMinTTL: 10 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.json, ErrorCachingMinTTL: 10 }
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - { Key: Project, Value: reactome-status }

  CachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-origin-cache-control"
        Comment: Honour each object's Cache-Control; cache key is the path only (no cookies, headers or query strings).
        MinTTL: 0
        DefaultTTL: 60
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  DataCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-data-cache"
        Comment: Live snapshots; an uploader cannot pin a bad file at the edge for longer than 5 minutes.
        MinTTL: 0
        DefaultTTL: 60
        MaxTTL: 300
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  ForceJsonFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-force-json"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve host-uploaded objects strictly as JSON, whatever content-type they were stored with.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var r = event.response;
          r.headers['content-type'] = { value: 'application/json; charset=utf-8' };
          r.headers['content-disposition'] = { value: 'inline' };
          return r;
        }

  DataHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-data-headers"
        Comment: Host-uploaded JSON must never execute or frame anything.
        SecurityHeadersConfig:
          ContentSecurityPolicy: { Override: true, ContentSecurityPolicy: "default-src 'none'; sandbox; frame-ancestors 'none'" }
          ContentTypeOptions: { Override: true }
          FrameOptions: { Override: true, FrameOption: DENY }
          ReferrerPolicy: { Override: true, ReferrerPolicy: no-referrer }
          StrictTransportSecurity: { Override: true, AccessControlMaxAgeSec: 31536000, IncludeSubdomains: false }

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: Security headers incl. a CSP that only allows the page's own files and Google Fonts.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self';
              img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'
          ContentTypeOptions: { Override: true }
          FrameOptions: { Override: true, FrameOption: DENY }
          ReferrerPolicy: { Override: true, ReferrerPolicy: strict-origin-when-cross-origin }
          StrictTransportSecurity: { Override: true, AccessControlMaxAgeSec: 31536000, IncludeSubdomains: false }
          XSSProtection: { Override: true, Protection: true, ModeBlock: true }

  CollectorUploadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${DomainName}-collector-upload"
      Description: Lets production hosts upload status snapshots (data/ and raw/ only).
      Roles: !If [AttachToRole, [!Ref CollectorRoleName], !Ref "AWS::NoValue"]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: UploadSnapshots
            Effect: Allow
            Action: [s3:PutObject]
            Resource:
              - !Sub "${Bucket.Arn}/data/*"
              - !Sub "${Bucket.Arn}/raw/*"
          - Sid: ListOwnPrefixes
            # `aws s3 sync` lists the destination to decide what changed; allow listing only under data/ and raw/
            Effect: Allow
            Action: [s3:ListBucket]
            Resource: !GetAtt Bucket.Arn
            Condition:
              StringLike:
                s3:prefix: ["data/*", "raw/*"]

Outputs:
  BucketName:
    Value: !Ref Bucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Create a DNS-only CNAME for DomainName pointing here.
    Value: !GetAtt Distribution.DomainName
  CollectorUploadPolicyArn:
    Value: !Ref CollectorUploadPolicy
